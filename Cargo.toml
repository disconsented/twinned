[workspace]
members = ["twinned", "twinned-macros"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/disconsented/twinned"
version = "0.1.0"

[workspace.dependencies]
twinned-macros = { path = "./twinned-macros", version = "0.1.0" }

quote = "1.0"
salvo = { features = ["oapi"], version = "0.96" }
serde = { features = ["derive"], version = "1.0" }
serde_json = "1.0"
surrealdb-types = "3.1"
syn = "3.0"
